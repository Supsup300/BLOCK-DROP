name: Build BLOCK DROP Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional Play signing
        if: ${{ secrets.BLOCKDROP_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BLOCKDROP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BLOCKDROP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BLOCKDROP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BLOCKDROP_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build, lint and package
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lint assembleDebug bundleRelease

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: block-drop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: block-drop-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
